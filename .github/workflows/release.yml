name: Release Plugin

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug structure
        run: |
          pwd
          find . -name "info.yaml" -not -path "*/node_modules/*"

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build ZIP
        run: |
          PLUGIN_DIR=$(dirname "$(find . -name info.yaml -not -path './.git/*' | head -n1)")
          echo "Плагин найден в: $PLUGIN_DIR"
          cd "$PLUGIN_DIR"
          zip -r "$GITHUB_WORKSPACE/tracker-manager-${{ steps.version.outputs.VERSION }}.zip" .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.VERSION }}
          tag_name: ${{ steps.version.outputs.VERSION }}
          files: tracker-manager-${{ steps.version.outputs.VERSION }}.zip
          generate_release_notes: true