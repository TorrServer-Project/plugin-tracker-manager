name: Release Plugin

on:
  push:
    tags:
      - '*'   # тег = версия из info.yaml, любой формат

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Read info.yaml
        id: meta
        run: |
          python3 - <<'PY'
          import os, yaml, sys, json
          info_path = None
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in ('.git',)]
              if 'info.yaml' in files:
                  info_path = os.path.join(root, 'info.yaml')
                  break
          if not info_path:
              sys.exit('::error::info.yaml not found')
          with open(info_path, encoding='utf-8') as f:
              info = yaml.safe_load(f)

          plugin_dir = os.path.dirname(info_path) or '.'
          icon_rel   = (info.get('icon') or '').lstrip('/')

          out = {
              'plugin_dir':  plugin_dir,
              'id':          info['id'],
              'name':        info['name'],
              'version':     info['version'],
              'author':      info.get('author', ''),
              'description': info.get('description', ''),
              'icon_rel':    icon_rel,
          }
          # min_silo_version — только если есть
          if info.get('min_silo_version'):
              out['min_silo'] = info['min_silo_version']

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              for k, v in out.items():
                  f.write(f'{k}={v}\n')
          PY

      - name: Validate tag vs version
        run: |
          TAG="${{ github.ref_name }}"
          INFO="${{ steps.meta.outputs.version }}"
          if [ "$TAG" != "$INFO" ]; then
            echo "::error::Тег '$TAG' не совпадает с version='$INFO' в info.yaml"
            exit 1
          fi

      - name: Build ZIP and extract icon
        id: build
        run: |
          ID="${{ steps.meta.outputs.id }}"
          VERSION="${{ steps.meta.outputs.version }}"
          PLUGIN_DIR="${{ steps.meta.outputs.plugin_dir }}"
          ICON_REL="${{ steps.meta.outputs.icon_rel }}"

          ZIP_NAME="${ID}-v${VERSION}.zip"
          (cd "$PLUGIN_DIR" && zip -r "$GITHUB_WORKSPACE/$ZIP_NAME" .)

          ICON_NAME=""
          if [ -n "$ICON_REL" ]; then
            ICON_EXT="${ICON_REL##*.}"
            ICON_NAME="${ID}-icon.${ICON_EXT}"
            ICON_PATH="$PLUGIN_DIR/$ICON_REL"
            if [ ! -f "$ICON_PATH" ]; then
              echo "::error::Иконка не найдена: $ICON_PATH"
              exit 1
            fi
            cp "$ICON_PATH" "$ICON_NAME"
          fi

          SIZE=$(stat -c%s "$ZIP_NAME")
          SHA256=$(sha256sum "$ZIP_NAME" | awk '{print $1}')

          {
            echo "zip_name=$ZIP_NAME"
            echo "icon_name=$ICON_NAME"
            echo "size=$SIZE"
            echo "sha256=$SHA256"
          } >> $GITHUB_OUTPUT

      - name: Generate info.json
        env:
          ID:          ${{ steps.meta.outputs.id }}
          NAME:        ${{ steps.meta.outputs.name }}
          VERSION:     ${{ steps.meta.outputs.version }}
          AUTHOR:      ${{ steps.meta.outputs.author }}
          DESCRIPTION: ${{ steps.meta.outputs.description }}
          MIN_SILO:    ${{ steps.meta.outputs.min_silo }}
          ZIP_NAME:    ${{ steps.build.outputs.zip_name }}
          ICON_NAME:   ${{ steps.build.outputs.icon_name }}
          SIZE:        ${{ steps.build.outputs.size }}
          SHA256:      ${{ steps.build.outputs.sha256 }}
        run: |
          python3 - <<'PY'
          import json, os
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{os.environ['GITHUB_REF_NAME']}"
          icon_name = os.environ.get('ICON_NAME', '')

          info = {
              "id":           os.environ['ID'],
              "name":         os.environ['NAME'],
              "version":      os.environ['VERSION'],
              "author":       os.environ['AUTHOR'],
              "description":  os.environ['DESCRIPTION'],
              "icon":         f"{base}/{icon_name}" if icon_name else "",
              "download_url": f"{base}/{os.environ['ZIP_NAME']}",
              "size":         int(os.environ['SIZE']),
              "sha256":       os.environ['SHA256'],
              "homepage":     f"https://github.com/{os.environ['GITHUB_REPOSITORY']}",
          }
          # min_silo_version — только если задан
          min_silo = os.environ.get('MIN_SILO', '').strip()
          if min_silo:
              info["min_silo_version"] = min_silo

          with open('info.json', 'w', encoding='utf-8') as f:
              json.dump(info, f, indent=2, ensure_ascii=False)
              f.write('\n')
          PY

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.meta.outputs.version }}
          tag_name: ${{ github.ref_name }}
          files: |
            ${{ steps.build.outputs.zip_name }}
            ${{ steps.build.outputs.icon_name }}
            info.json
          generate_release_notes: true